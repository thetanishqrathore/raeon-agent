# Self-hosted SearXNG for Hermes' resilient search router.
# Free, uncapped, Google-grade (aggregates Google/Bing/DuckDuckGo/Brave/...).
# This is the recommended PRIMARY tier for a daily, high-volume lead-gen run —
# no per-query cost and no third-party rate cap (you control it).
#
# Quick start:
#   1. cd deploy/searxng
#   2. (edit settings.yml — set a real secret_key; JSON + limiter:false are preset)
#   3. docker compose up -d
#   4. In the environment Hermes RUNS IN (not just your shell):
#        export SEARXNG_URL=http://localhost:8888
#      (or set it in config.yaml via Hermes' env mechanism)
#   5. config.yaml -> web.search_backend: resilient   (searxng becomes tier-1)
#   6. Verify:  curl 'http://localhost:8888/search?q=test&format=json'  -> JSON
services:
  searxng:
    image: searxng/searxng:latest
    container_name: hermes-searxng
    ports:
      - "8888:8080"          # Hermes connects via SEARXNG_URL=http://localhost:8888
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped
    # The agent is the only client; keep it private (bind localhost on a server):
    # ports: ["127.0.0.1:8888:8080"]
