name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: custom research/search checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev,anthropic]'
          .venv/bin/python -m pip install lxml==5.3.0 rank-bm25==0.2.2

      - name: Offline demo
        run: .venv/bin/python scripts/demo_research.py

      - name: Focused tests
        run: |
          scripts/run_tests.sh \
            tests/agent/test_research_ranking.py \
            tests/agent/test_research_citations.py \
            tests/agent/test_research_report.py \
            tests/agent/test_research_state.py \
            tests/tools/test_think_tool.py \
            tests/tools/test_research_ledger_tool.py \
            tests/scripts/test_lead_gen_batch.py \
            tests/scripts/test_web_chat_auth_scripts.py \
            tests/plugins/web/test_hermes_scraper.py \
            tests/plugins/web/test_resilient_router.py \
            tests/hermes_cli/test_research_config.py \
            tests/hermes_cli/test_search_router_config.py \
            -q

  web:
    name: web dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm --workspace web run typecheck

      - name: Unit tests
        run: npm --workspace web test

      - name: Build
        run: npm --workspace web run build

      - name: Production audit
        run: npm audit --omit=dev
